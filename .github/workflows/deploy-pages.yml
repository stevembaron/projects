name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: gear-deals-refresh
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/test-deals.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tests
        run: python3 -m unittest discover tests
      - name: Apply current preferences and UI to saved data
        run: python3 scripts/deal_monitor.py --rerender
      - name: Validate pending ChatGPT brief
        run: python3 scripts/chatgpt_brief.py
      - name: Refresh dashboard and task input
        run: |
          python3 scripts/deal_monitor.py --rerender
          python3 scripts/chatgpt_brief.py --export
      - name: Save validated brief and generated pages
        run: |
          bash scripts/publish_generated_report.sh "Publish validated ChatGPT gear brief" \
            data/deal_brief.json data/deal_brief.md data/briefs deal-brief/index.html \
            data/chatgpt_brief_status.json data/chatgpt_brief_input.json \
            data/tracker.json data/deals.html ski-deals/index.html
      - name: Stage public files
        run: python3 scripts/build_public.py
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
