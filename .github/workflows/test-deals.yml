name: Test gear deals
on:
  pull_request:
    paths: ["scripts/**", "tests/**", "config/**", "assets/**", ".github/workflows/**"]
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover tests
      - run: node --check assets/deals.js
      - run: python3 scripts/deal_monitor.py --rerender
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/gear-browser-test" --no-save playwright
          "$RUNNER_TEMP/gear-browser-test/node_modules/.bin/playwright" install --with-deps chromium
      - name: Desktop and mobile interactions
        run: NODE_PATH="$RUNNER_TEMP/gear-browser-test/node_modules" node tests/browser_smoke.cjs
