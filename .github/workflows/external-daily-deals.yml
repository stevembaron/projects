name: External Daily Deal Refresh
on:
  schedule:
    - cron: "17 10 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch:
  workflow_call:
  repository_dispatch:
    types: [daily-deals]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: gear-deals-refresh
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/test-deals.yml
  update-reports:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Regression tests
        run: python3 -m unittest discover tests
      - name: Collect clothing
        id: clothing
        continue-on-error: true
        run: python3 scripts/deal_monitor.py --config config/clothing_deal_sources.json
      - name: Collect skis
        id: skis
        continue-on-error: true
        run: python3 scripts/deal_monitor.py
      - name: Build shared snapshot
        run: python3 scripts/deal_monitor.py --rerender
      - name: Export input for the ChatGPT scheduled task
        run: python3 scripts/chatgpt_brief.py --export
      - name: Record outcomes
        run: python3 scripts/record_run.py --ski "${{ steps.skis.outcome }}" --clothing "${{ steps.clothing.outcome }}" --brief "waiting_for_chatgpt"
      - name: Rebuild dashboard
        run: python3 scripts/deal_monitor.py --rerender
      - name: Publish data and generated pages
        run: |
          bash scripts/publish_generated_report.sh "Update gear deals" \
            data/chatgpt_brief_input.json data/deal_report.md data/deals.html data/deals.json data/tracker.json data/run_status.json \
            data/price_history.json data/evo_constructor_key.json ski-deals/index.html \
            data/clothing_deals.json data/clothing_deals.html data/clothing_deal_report.md clothing-deals/index.html \
            data/deal_brief.md data/deal_brief.json data/briefs deal-brief/index.html
      - name: Stage public files
        run: python3 scripts/build_public.py
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Run summary
        if: always()
        run: |
          echo "### Gear deals refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "Ski collection: ${{ steps.skis.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Clothing collection: ${{ steps.clothing.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Brief: awaiting the ChatGPT scheduled task; previous brief retained" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: ${{ steps.deployment.outcome }}" >> "$GITHUB_STEP_SUMMARY"
